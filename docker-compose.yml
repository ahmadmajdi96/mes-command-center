# Run the whole project with:  docker compose up
#
# The app talks to the same hosted database/auth as the preview: the
# connection settings come from the .env file in this folder, which is
# passed straight into the container. Nothing about the connection changes.

services:
  app:
    build: .
    container_name: cortanex-mes
    ports:
      - "8111:8111"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=8111
    volumes:
      # Live-reload: mount source, keep container's node_modules
      - .:/app
      - /app/node_modules
    restart: unless-stopped
